[package]
name = "specter"
version = "1.0.0"
edition = "2024"
description = "Specter - Autonomous Browser Automation & Distributed Mesh Runtime"
repository = "https://github.com/tuquet/cli"
license = "MIT"

[lib]
name = "automa_core"
path = "src/lib.rs"

[[bin]]
name = "specter"
path = "src/main.rs"

[dependencies]
tuquet-faker = { path = "../faker" }
tuquet-browser = { path = "../browser", features = ["utoipa"] }
tuquet-runner = { package = "runner", path = "../runner" }
axum = { version = "0.8.9", features = ["ws"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"
aes = "0.8.4"
cbc = "0.1.2"
md-5 = "0.10.6"
sha2 = "0.10.8"
hmac = "0.12.1"
base64 = "0.22.1"
rand = "0.8.5"
hex = "0.4.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "socks"] }
zip = "0.6.6"
uuid = { version = "1.10", features = ["v4"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tokio-stream = { version = "0.1.19", features = ["sync"] }
futures = "0.3.34"
utoipa = { version = "5.5.0", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
tokio-util = "0.7.19"
tower-http = { version = "0.7.0", features = ["cors", "fs"] }
sysinfo = "0.39.6"
reedline = "0.52.0"
nu-ansi-term = "0.50.3"
socket2 = "0.6"
flate2 = "1.0"
tar = "0.4"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tower = { version = "0.5.3", features = ["util"] }

[lints.clippy]
collapsible_if = "allow"
too_many_arguments = "allow"
redundant_pattern_matching = "allow"

