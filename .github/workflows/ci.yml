name: CI (Test & Lint)

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'
      - 'diagrams/**'
      - 'CHEATSHEET.md'
      - 'LICENSE'
      - 'AGENTS.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'
      - 'diagrams/**'
      - 'CHEATSHEET.md'
      - 'LICENSE'
      - 'AGENTS.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test & Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Cargo.toml path-depends on the `crates/faker` submodule.
          submodules: recursive

      - name: Checkout browser dependency
        shell: bash
        run: git clone --depth 1 https://github.com/tuquet/browser.git ../browser

      # `tuquet/runner` is private (leaked-history containment), so an anonymous clone fails.
      # The repo carries a read-only deploy key for this purpose; no PAT is needed.
      - name: Checkout runner dependency
        shell: bash
        env:
          RUNNER_DEPLOY_KEY: ${{ secrets.RUNNER_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$RUNNER_DEPLOY_KEY" > ~/.ssh/runner_deploy_key
          chmod 600 ~/.ssh/runner_deploy_key
          GIT_SSH_COMMAND="ssh -i ~/.ssh/runner_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            git clone --depth 1 git@github.com:tuquet/runner.git ../worker

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Cargo Check
        run: cargo check --verbose --target ${{ matrix.target }}

      - name: Cargo Clippy
        run: cargo clippy --all-targets --target ${{ matrix.target }} -- -D warnings

      - name: Run Tests
        run: cargo test --verbose --target ${{ matrix.target }}

  notify:
    name: Notify Telegram
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Notification
        uses: tuquet/bot@main
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          status: ${{ needs.test.result }}
