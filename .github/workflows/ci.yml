name: CI (Test & Lint)

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'
      - 'diagrams/**'
      - 'CHEATSHEET.md'
      - 'LICENSE'
      - 'AGENTS.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'
      - 'diagrams/**'
      - 'CHEATSHEET.md'
      - 'LICENSE'
      - 'AGENTS.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test & Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout browser dependency
        shell: bash
        run: git clone --depth 1 https://github.com/tuquet/browser.git ../browser

      - name: Checkout faker dependency
        shell: bash
        run: git clone --depth 1 https://github.com/tuquet/faker.git ../faker

      - name: Checkout runner dependency
        shell: bash
        run: git clone --depth 1 https://github.com/tuquet/runner.git ../runner

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Cargo Check
        run: cargo check --verbose --target ${{ matrix.target }}

      - name: Cargo Clippy
        run: cargo clippy --all-targets --target ${{ matrix.target }} -- -D warnings

      - name: Run Tests
        run: cargo test --verbose --target ${{ matrix.target }}

  notify:
    name: Notify Telegram
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Notification
        uses: tuquet/bot@main
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          status: ${{ needs.test.result }}
