name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: tq.exe
            archive_ext: zip
            asset_prefix: tq-windows-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: tq
            archive_ext: tar.gz
            asset_prefix: tq-linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_name: tq
            archive_ext: tar.gz
            asset_prefix: tq-macos-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            bin_name: tq
            archive_ext: tar.gz
            asset_prefix: tq-macos-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Cargo.toml path-depends on the `crates/faker` submodule.
          submodules: recursive

      - name: Checkout browser dependency
        shell: bash
        run: git clone --depth 1 https://github.com/tuquet/browser.git ../browser

      # `tuquet/runner` is private (leaked-history containment), so an anonymous clone fails.
      - name: Checkout runner dependency
        shell: bash
        run: git clone --depth 1 https://x-access-token:${{ secrets.SCOOP_SYNC_TOKEN }}@github.com/tuquet/runner.git ../worker

      - name: Determine Release Tag & Version
        id: vars
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${{ github.event.inputs.tag }}"
          fi
          VERSION="${TAG#v}"
          echo "RELEASE_TAG=${TAG}" >> $GITHUB_ENV
          echo "RELEASE_VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --bin tq --target ${{ matrix.target }}

      - name: Package Windows Binary (.zip)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $binPath = "target/${{ matrix.target }}/release/tq.exe"
          New-Item -ItemType Directory -Path "dist" -Force
          Copy-Item $binPath -Destination "dist/tq.exe"
          $archiveName = "${{ matrix.asset_prefix }}.zip"
          Compress-Archive -Path "dist/tq.exe" -DestinationPath "$archiveName" -Force
          $hash = (Get-FileHash -Algorithm SHA256 "$archiveName").Hash.ToLower()
          "$hash  $archiveName" | Out-File -Encoding ascii "$archiveName.sha256"
          Write-Host "Packaged $archiveName (SHA256: $hash)"

      - name: Package Unix Binary (.tar.gz)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          BIN_PATH="target/${{ matrix.target }}/release/tq"
          mkdir -p dist
          cp "${BIN_PATH}" dist/tq
          chmod +x dist/tq
          ARCHIVE_NAME="${{ matrix.asset_prefix }}.tar.gz"
          tar -czf "${ARCHIVE_NAME}" -C dist tq
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
          else
            shasum -a 256 "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
          fi
          echo "Packaged ${ARCHIVE_NAME}"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Release ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: false
          files: |
            ${{ matrix.asset_prefix }}.${{ matrix.archive_ext }}
            ${{ matrix.asset_prefix }}.${{ matrix.archive_ext }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Notify & Sync Ecosystem
    needs: [build-release]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Scoop Bucket Auto-Update
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          repository: tuquet/scoop-bucket
          event-type: upstream-release
          client-payload: '{"tag": "${{ github.ref_name || github.event.inputs.tag }}"}'
        continue-on-error: true

      - name: Send Telegram Notification
        uses: tuquet/bot@main
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          status: ${{ needs.build-release.result }}
          type: 'release'
          tag: ${{ github.ref_name || github.event.inputs.tag }}
